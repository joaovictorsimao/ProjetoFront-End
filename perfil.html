    <main class="conteudo">

        <h1>Perfil da Oficina</h1>

        <form id="perfilForm">

            <label>Nome da Oficina</label>
            <input
                type="text"
                id="oficina"
            >

            <label>Nome do Proprietário</label>
            <input
                type="text"
                id="proprietario"
            >

            <label>Telefone</label>
            <input
                type="text"
                id="telefone"
            >

            <label>Cidade</label>
            <input
                type="text"
                id="cidade"
            >

            <label>E-mail</label>
            <input
                type="email"
                id="email"
            >

            <label>Nova Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Deixe em branco para não alterar"
            >

            <br><br>

            <button type="submit">

                Salvar Alterações

            </button>

        </form>

    </main>

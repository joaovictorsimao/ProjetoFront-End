<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Cliente - Sistema de Oficina</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="cadastro-container">

        <div class="cadastro-box">

            <h1>Sistema de Oficina</h1>

            <h2>Novo Cliente</h2>

            <form id="clienteForm">

                <h3>Dados do Cliente</h3>

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do cliente"
                    required
                >

                <label for="cpf">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="000.000.000-00"
                >

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="cliente@email.com"
                >

                <label for="endereco">
                    Endereço
                </label>

                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua, número, bairro"
                >


                <h3>Dados do Veículo</h3>

                <label for="marca">
                    Marca
                </label>

                <input
                    type="text"
                    id="marca"
                    placeholder="Ex: Volkswagen"
                    required
                >

                <label for="modelo">
                    Modelo
                </label>

                <input
                    type="text"
                    id="modelo"
                    placeholder="Ex: Gol"
                    required
                >

                <label for="ano">
                    Ano
                </label>

                <input
                    type="number"
                    id="ano"
                    placeholder="Ex: 2020"
                >

                <label for="placa">
                    Placa
                </label>

                <input
                    type="text"
                    id="placa"
                    placeholder="ABC-1234"
                    required
                >

                <label for="cor">
                    Cor
                </label>

                <input
                    type="text"
                    id="cor"
                    placeholder="Ex: Preto"
                >

                <label for="km">
                    Quilometragem
                </label>

                <input
                    type="number"
                    id="km"
                    placeholder="Ex: 85000"
                >

                <label for="observacoes">
                    Observações
                </label>

                <textarea
                    id="observacoes"
                    placeholder="Informações adicionais sobre o cliente ou veículo"
                    rows="4"
                ></textarea>


                <button type="submit">
                    Cadastrar Cliente
                </button>

            </form>

            <p id="mensagem"></p>

            <hr>

            <a href="clientes.html">
                Voltar para Clientes
            </a>

        </div>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/cliente.js"></script>

</body>

</html>

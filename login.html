<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Oficina</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<>

    <div class="login-container">

        <div class="login-box">

            <h1>Sistema de Oficina</h1>

            <h2>Entrar</h2>

            <form id="loginForm">

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label>Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="mensagem"></p>

            <hr>

            <p>
                Ainda não possui uma oficina cadastrada?
            </p>

            <a href="cadastro.html">
                Cadastrar Oficina
            </a>

        </div>

    </div>

    <script src="js/storage.js"></script>
<script src="js/login.js"></script>

</body>

</html>
